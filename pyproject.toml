[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodrf"
version = "0.8.3"
description = "Dead simple Django REST API generator with role-based permissions"
readme = "README.md"
authors = [
    {name = "Alexander Collins"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14.0",
    "drf-yasg>=1.21.0",
    "django-filter>=23.0",
]

[project.optional-dependencies]
fast = [
    "msgspec>=0.18.0",
]
dev = [
    "pytest>=6.0",
    "pytest-django>=4.0",
    "pytest-cov>=2.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "msgspec>=0.18.0",
    "Pillow>=9.0",  # the test app has an ImageField
    # Lint tools are pinned so local runs and CI agree.
    "black==26.10.1",
    "flake8==7.4.1",
    "isort==9.0.2",
]
docs = [
    "sphinx>=5.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=1.0",
]
allauth = [
    "django-allauth>=0.57.0",
]

[project.urls]
Homepage = "https://turbodrf.com"
Documentation = "https://turbodrf.com/docs/"
Repository = "https://github.com/AlexanderCollins/TurboDRF"
"Bug Tracker" = "https://github.com/AlexanderCollins/TurboDRF/issues"

[tool.setuptools.packages.find]
include = ["turbodrf*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -n auto --dist=loadfile"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip = ["migrations"]
